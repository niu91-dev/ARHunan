name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 同步前端离线资产到 Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r device-check/public/* android/app/src/main/assets/

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Gradle 环境
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 编译 Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: 上传 APK 构件 (可直接下载)
        uses: actions/upload-artifact@v4
        with:
          name: hunan-ar-demo-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
